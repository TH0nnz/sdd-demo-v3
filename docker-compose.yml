services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: workreport
      POSTGRES_USER: workreport
      POSTGRES_PASSWORD: workreport
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workreport"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    ports:
      - "8080:8080"
    environment:
      DB_USERNAME: workreport
      DB_PASSWORD: workreport
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/workreport
      JWT_SECRET: mySecretKeyForDevelopmentOnlyDoNotUseInProduction2026
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  pgdata:
