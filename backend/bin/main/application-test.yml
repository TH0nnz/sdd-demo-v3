spring:
  datasource:
    url: jdbc:tc:postgresql:16:///workreport_test
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    clean-disabled: false

jwt:
  secret: test-secret-key-for-unit-testing-only-not-for-production-use-2026
  expiration-ms: 3600000

logging:
  level:
    com.workreport: DEBUG
    org.testcontainers: INFO
