spring:
  application:
    name: work-report
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://localhost:5432/workreport
    username: ${DB_USERNAME:workreport}
    password: ${DB_PASSWORD:workreport}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

jwt:
  secret: ${JWT_SECRET:mySecretKeyForDevelopmentOnlyDoNotUseInProduction2026}
  expiration-ms: 1800000

server:
  port: 8080

logging:
  level:
    com.workreport: DEBUG
    org.hibernate.SQL: DEBUG
