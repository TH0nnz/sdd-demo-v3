plugins {
    id 'java'
    id 'org.springframework.boot' version '4.0.2'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'checkstyle'
    id 'jacoco'
}

group = 'com.workreport'
version = '0.1.0-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(24)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
    maven { url 'https://repo.spring.io/milestone' }
}

dependencies {
    // Spring Boot Starters
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    // AspectJ weaver enables @Aspect-based AOP (version managed by Spring Boot BOM)
    implementation 'org.aspectj:aspectjweaver'

    // Jackson
    implementation 'com.fasterxml.jackson.core:jackson-databind'

    // PostgreSQL
    runtimeOnly 'org.postgresql:postgresql'

    // Lombok
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // JWT
    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'

    // Testing
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-webmvc-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'org.testcontainers:junit-jupiter:1.21.1'
    testImplementation 'org.testcontainers:postgresql:1.21.1'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'

    // Lombok for tests
    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
    useJUnitPlatform()
    // In CI, test failures must fail the pipeline; keep local runs permissive.
    ignoreFailures = !System.getenv().containsKey('CI')
    finalizedBy jacocoTestReport
}

// JaCoCo Configuration
jacoco {
    toolVersion = '0.8.13'
}

// Excluded from coverage: controller (integration-tested), config/security (framework),
// repository (Spring Data interfaces), and DTOs that are plain data holders.
// Service layer is included; unit tests with mocks must achieve 90% coverage.
def jacocoExcludes = [
    'com/workreport/controller/**',
    'com/workreport/config/**',
    'com/workreport/security/**',
    'com/workreport/repository/**',
    'com/workreport/annotation/**',
    'com/workreport/dto/department/**',
    'com/workreport/dto/task/**',
    'com/workreport/dto/common/**',
    'com/workreport/WorkReportApplication.class'
]

jacocoTestReport {
    dependsOn test
    afterEvaluate {
        classDirectories.setFrom(files(classDirectories.files.collect {
            fileTree(dir: it, exclude: jacocoExcludes)
        }))
    }
    reports {
        xml.required = true
        html.required = true
    }
}

jacocoTestCoverageVerification {
    afterEvaluate {
        classDirectories.setFrom(files(classDirectories.files.collect {
            fileTree(dir: it, exclude: jacocoExcludes)
        }))
    }
    violationRules {
        rule {
            limit {
                minimum = 0.90
            }
        }
    }
}

tasks.named('check') {
    dependsOn jacocoTestCoverageVerification
}

// Checkstyle Configuration
checkstyle {
    toolVersion = '10.21.4'
    configFile = file("${rootDir}/config/checkstyle/checkstyle.xml")
    maxWarnings = 999
    // In CI, checkstyle failures must fail the pipeline; keep local runs permissive.
    ignoreFailures = !System.getenv().containsKey('CI')
}

// Service API Annotation Check
// Verifies every public method in service classes is annotated with
// @RequireRole or @PublicApi, enforcing explicit access-control declarations.
task checkServiceAnnotations {
    description = 'Verify every public method in service classes declares @RequireRole or @PublicApi'
    group = 'verification'
    doLast {
        def violations = []
        def serviceDir = file("src/main/java/com/workreport/service")

        serviceDir.listFiles()?.findAll { it.name.endsWith('.java') }?.each { srcFile ->
            def lines = srcFile.readLines('UTF-8')
            lines.eachWithIndex { line, idx ->
                def stripped = line.trim()

                // Only consider "public " declarations
                if (!stripped.startsWith('public ')) return

                // Skip top-level and inner class/interface/enum declarations
                if (stripped ==~ /public (abstract |final |static )*(class|interface|enum|@interface)\b.*/) return

                // Skip constructors: "public UpperCaseName(" – single identifier before "("
                // Method returns have a second token (method name) before "("
                if (stripped ==~ /public [A-Z]\w*\s*\(.*/) return

                // This is a public method – scan backwards through the annotation block
                def hasAnnotation = false
                for (int j = idx - 1; j >= 0; j--) {
                    def prev = lines[j].trim()
                    if (prev.startsWith('@RequireRole') || prev.startsWith('@PublicApi')) {
                        hasAnnotation = true
                        break
                    }
                    // Non-annotation, non-blank line ends the annotation block
                    if (prev && !prev.startsWith('@')) break
                }

                if (!hasAnnotation) {
                    violations << "  ${srcFile.name}:${idx + 1}  ->  ${stripped}"
                }
            }
        }

        if (violations) {
            throw new GradleException(
                "MISSING @RequireRole or @PublicApi on service methods:\n${violations.join('\n')}"
            )
        }
    }
}

checkstyleMain.dependsOn checkServiceAnnotations

