name: Auto-Fix on Issue Opened

# ==============================================================================
# 說明：Issue 開啟後自動指派給 GitHub Copilot Coding Agent
# ==============================================================================
#
# 觸發條件：由 TH0nnz 開啟的 issue
#
# 運作方式：
#   1. Issue 開啟後，此 workflow 自動將 issue 指派給 copilot
#   2. GitHub Copilot Coding Agent 接收指派後會：
#      - 分析 issue 標題與描述
#      - 掃描 codebase 找出相關程式碼
#      - 自動建立修復分支
#      - 提交程式碼變更
#      - 開啟 Pull Request 供審查
#
# 前置需求：
#   - 儲存庫需啟用 GitHub Copilot（個人版 / Business / Enterprise）
#   - Settings > Actions > General：
#       ✓ Read and write permissions
#       ✓ Allow GitHub Actions to create and approve pull requests
#
# ==============================================================================

on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  assign-to-copilot:
    # 只處理由儲存庫擁有者開啟的 issue
    if: github.event.issue.user.login == 'TH0nnz'
    runs-on: ubuntu-latest

    steps:
      - name: Assign issue to GitHub Copilot Coding Agent
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            const issueNumber = context.issue.number;

            // 將 issue 指派給 copilot，觸發 Copilot Coding Agent 自動修復
            await github.rest.issues.addAssignees({
              owner:        context.repo.owner,
              repo:         context.repo.repo,
              issue_number: issueNumber,
              assignees:    ['copilot'],
            });

            core.info(`Issue #${issueNumber} 已指派給 GitHub Copilot Coding Agent`);
