name: Auto-Fix on Issue Opened

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  auto-fix:
    # Only run for issues filed by the repository owner
    if: github.event.issue.user.login == 'TH0nnz'
    runs-on: ubuntu-latest

    steps:
      - name: Extract issue metadata
        id: ctx
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          echo "issue_number=${ISSUE_NUMBER}" >> "$GITHUB_OUTPUT"

          # Extract the issue type (ui / flow / logic / add) from the "類型" section.
          # The issue template renders it as:
          #   ### 類型
          #   <blank line>
          #   <type value>
          CATEGORY=$(echo "$ISSUE_BODY" \
            | awk '/^### 類型/{found=1; next} found && NF{print tolower($0); exit}' \
            | grep -Eo '(ui|flow|logic|add)' | head -1 || true)
          echo "category=${CATEGORY}" >> "$GITHUB_OUTPUT"

      - name: Assign to Copilot and post instructions
        uses: actions/github-script@v7
        env:
          CATEGORY: ${{ steps.ctx.outputs.category }}
        with:
          script: |
            const issueNumber = ${{ steps.ctx.outputs.issue_number }};
            const category    = process.env.CATEGORY ?? '';
            const categoryTag = category ? ` [${category}]` : '';
            const autofixFile = `.autofix/issue-${issueNumber}.md`;

            // Assign the issue to the Copilot coding agent to trigger it.
            try {
              await github.rest.issues.addAssignees({
                owner:        context.repo.owner,
                repo:         context.repo.repo,
                issue_number: issueNumber,
                assignees:    ['copilot'],
              });
            } catch (e) {
              core.warning(`Could not assign Copilot: ${e.message}`);
            }

            // Post a detailed instruction comment so the agent knows exactly
            // what to produce (code fix + .autofix/ documentation + PR).
            const comment = [
              `@copilot 請根據此 Issue 的描述進行修復${categoryTag}。`,
              ``,
              `## 任務要求`,
              `1. 根據 Issue 內容，找出相關程式碼並進行修正。`,
              `2. 完成修改後，在 \`${autofixFile}\` 建立一份 Markdown 報告，包含：`,
              `   - **問題描述**：重述此 Issue 要解決的問題`,
              `   - **修改檔案清單**：列出所有更動的檔案及更動摘要`,
              `   - **修復說明**：說明修復邏輯與思路`,
              `   - **測試步驟**：如何驗證修復成果`,
              `3. 將所有變更（程式碼修改 + \`${autofixFile}\`）放入同一個 commit，並開立 PR 供審核。`,
            ].join('\n');

            await github.rest.issues.createComment({
              owner:        context.repo.owner,
              repo:         context.repo.repo,
              issue_number: issueNumber,
              body:         comment,
            });
