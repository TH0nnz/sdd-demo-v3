name: Auto-Fix on Issue Opened

on:
  issues:
    types: [opened]

permissions:
  contents: write
  pull-requests: write
  issues: read

jobs:
  auto-fix:
    # Only run for issues filed by the repository owner
    if: github.event.issue.user.login == 'TH0nnz'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract context
        id: ctx
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          BRANCH_NAME="autofix/issue-${ISSUE_NUMBER}"
          echo "issue_number=${ISSUE_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "branch_name=${BRANCH_NAME}"   >> "$GITHUB_OUTPUT"
          echo "ISSUE_URL=${ISSUE_URL}"       >> "$GITHUB_ENV"

          # Extract the issue type (ui / flow / logic / add) from the "類型" section of the body.
          # The issue template renders it as:
          #   ### 類型
          #   <blank line>
          #   <type value>
          CATEGORY=$(echo "$ISSUE_BODY" \
            | awk '/^### 類型/{found=1; next} found && NF{print tolower($0); exit}' \
            | grep -Eo '(ui|flow|logic)' | head -1 || true)
          echo "category=${CATEGORY}" >> "$GITHUB_OUTPUT"

      - name: Create fix branch
        env:
          BRANCH_NAME: ${{ steps.ctx.outputs.branch_name }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH_NAME"

      - name: Write autofix context file
        # Untrusted string values (title, body) are passed through env vars
        # and written via Python to avoid any shell-injection risks.
        env:
          ISSUE_NUMBER: ${{ steps.ctx.outputs.issue_number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          mkdir -p .autofix
          python3 - <<'PYEOF'
          import os, pathlib, textwrap

          num   = os.environ["ISSUE_NUMBER"]
          title = os.environ.get("ISSUE_TITLE", "")
          body  = os.environ.get("ISSUE_BODY",  "")
          iurl  = os.environ.get("ISSUE_URL",   "")

          content = textwrap.dedent(f"""\
          # Auto-Fix: Issue #{num}

          **Issue title:** {title}
          **Issue URL:** {iurl}

          ## Issue body

          {body}

          ---
          *This file was created automatically by the auto-fix-on-issue workflow.
          Replace this file (or the relevant source files) with the actual fix.*
          """)

          pathlib.Path(f".autofix/issue-{num}.md").write_text(content, encoding="utf-8")
          PYEOF

      - name: Commit autofix context
        env:
          ISSUE_NUMBER: ${{ steps.ctx.outputs.issue_number }}
        run: |
          git add .autofix/
          git commit -m "autofix: scaffold fix for issue #${ISSUE_NUMBER}"

      - name: Push branch
        env:
          BRANCH_NAME: ${{ steps.ctx.outputs.branch_name }}
        run: |
          git push origin "$BRANCH_NAME"

      - name: Create pull request
        uses: actions/github-script@v7
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          CATEGORY: ${{ steps.ctx.outputs.category }}
        with:
          script: |
            const issueNumber = ${{ steps.ctx.outputs.issue_number }};
            const branchName  = '${{ steps.ctx.outputs.branch_name }}';
            const issueTitle  = process.env.ISSUE_TITLE ?? '';
            const issueUrl    = process.env.ISSUE_URL   ?? '';
            const category    = process.env.CATEGORY    ?? '';
            const categoryTag = category ? ` [${category}]` : '';

            const prBody = [
              `Automated fix${categoryTag} proposed in response to issue #${issueNumber}.`,
              ``,
              `### Issue`,
              `**${issueTitle}**`,
              `${issueUrl}`,
              ``,
              `---`,
              `*Review and update the scaffolded file in \`.autofix/\` (or the relevant source files) before merging.*`,
            ].join('\n');

            await github.rest.pulls.create({
              owner:  context.repo.owner,
              repo:   context.repo.repo,
              title:  `autofix${categoryTag}: issue #${issueNumber} – ${issueTitle}`,
              head:   branchName,
              base:   context.payload.repository.default_branch,
              body:   prBody,
            });
