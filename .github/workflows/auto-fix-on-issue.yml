name: Auto-Fix on Issue Opened

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  auto-fix:
    # Only run for issues filed by the repository owner
    if: github.event.issue.user.login == 'TH0nnz'
    runs-on: ubuntu-latest

    steps:
      - name: Extract issue metadata
        id: ctx
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          echo "issue_number=${ISSUE_NUMBER}" >> "$GITHUB_OUTPUT"

          # Extract the issue type (ui / flow / logic / add) from the "類型" section.
          # The issue template renders it as:
          #   ### 類型
          #   <blank line>
          #   <type value>
          CATEGORY=$(echo "$ISSUE_BODY" \
            | awk '/^### 類型/{found=1; next} found && NF{print tolower($0); exit}' \
            | grep -Eo '(ui|flow|logic|add)' | head -1 || true)
          echo "category=${CATEGORY}" >> "$GITHUB_OUTPUT"

      - name: Assign to Copilot and post instructions
        uses: actions/github-script@v7
        env:
          CATEGORY: ${{ steps.ctx.outputs.category }}
        with:
          script: |
            const issueNumber = ${{ steps.ctx.outputs.issue_number }};
            const category    = process.env.CATEGORY ?? '';
            const categoryTag = category ? ` [${category}]` : '';
            const autofixFile = `.autofix/issue-${issueNumber}.md`;

            // Assign the issue to the Copilot coding agent to trigger it.
            try {
              await github.rest.issues.addAssignees({
                owner:        context.repo.owner,
                repo:         context.repo.repo,
                issue_number: issueNumber,
                assignees:    ['copilot'],
              });
            } catch (e) {
              core.warning(`Could not assign Copilot: ${e.message}`);
            }

            // Verify that Copilot is now listed as an assignee.
            const { data: issueData } = await github.rest.issues.get({
              owner:        context.repo.owner,
              repo:         context.repo.repo,
              issue_number: issueNumber,
            });
            const assigneeLogins = issueData.assignees.map(a => a.login.toLowerCase());
            const copilotAssigned = assigneeLogins.includes('copilot');
            if (copilotAssigned) {
              core.info(`Copilot successfully assigned to Issue #${issueNumber}, assignees: ${assigneeLogins.join(', ')}`);
            } else {
              core.warning(`Copilot assignment may not have succeeded. Current assignees: ${assigneeLogins.join(', ') || '(none)'}`);
            }

            // Post a detailed instruction comment so the agent knows exactly
            // what to produce (code fix + .autofix/ documentation + PR).
            const baseBranch = context.payload.repository.default_branch || 'main';
            const comment = [
              `@copilot 請根據此 Issue 的描述進行修復${categoryTag}。`,
              ``,
              `> **目標分支**：請將 PR 開立至 \`${baseBranch}\` 分支。`,
              ``,
              `## 任務要求`,
              `1. 根據 Issue 內容，找出相關程式碼並進行修正。`,
              `2. 完成修改後，在 \`${autofixFile}\` 建立一份 Markdown 報告，包含：`,
              `   - **問題描述**：重述此 Issue 要解決的問題`,
              `   - **修改檔案清單**：列出所有更動的檔案及更動摘要`,
              `   - **修復說明**：說明修復邏輯與思路`,
              `   - **測試步驟**：如何驗證修復成果`,
              `3. 將所有變更（程式碼修改 + \`${autofixFile}\`）放入同一個 commit，並開立 PR 供審核。`,
              ``,
              `## Commit 錯誤處理`,
              `如果在 commit 時遇到錯誤，請依照以下步驟排除：`,
              `- **Lint／格式錯誤**：執行對應的格式化指令（如 \`eslint --fix\`、\`prettier --write\`）修正後重新 commit。`,
              `- **測試失敗**：閱讀錯誤訊息，修正導致測試失敗的程式碼後重新 commit。`,
              `- **Merge conflict**：使用 \`git status\` 確認衝突檔案，手動解決衝突後執行 \`git add\` 再重新 commit。`,
              `- **Nothing to commit**：確認修改已正確儲存至磁碟，必要時重新套用變更。`,
              `- **其他錯誤**：閱讀完整錯誤訊息，依錯誤類型採取對應修正，排除後再重試 commit。`,
              ``,
              `每次排除錯誤後，請重新驗證所有變更並再次嘗試 commit，直到成功為止。`,
            ].join('\n');

            await github.rest.issues.createComment({
              owner:        context.repo.owner,
              repo:         context.repo.repo,
              issue_number: issueNumber,
              body:         comment,
            });
