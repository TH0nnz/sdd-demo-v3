name: Issue Intake on Opened

on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  intake:
    runs-on: ubuntu-latest
    steps:
      - name: Post issue intake summary
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const issueNumber = issue.number;
            const body = issue.body || '';

            function section(title) {
              const escaped = title.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
              const re = new RegExp(`^###\\s*${escaped}\\s*$([\\s\\S]*?)(?=^###\\s|$)`, 'mi');
              const m = body.match(re);
              return m ? m[1].trim() : '';
            }

            const rawType = section('類型').toLowerCase();
            const typeMatch = rawType.match(/\b(ui|flow|logic|add)\b/);
            const category = typeMatch ? typeMatch[1] : '未分類';

            const steps = section('重現步驟') || '（未填）';
            const actual = section('實際結果') || '（未填）';
            const expected = section('預期結果') || '（未填）';
            const files = section('相關元件/檔案') || '（未填）';
            const extra = section('補充資訊') || '（未填）';

            const comment = [
              `## Issue Intake Summary`,
              ``,
              `- 類型：${category}`,
              `- 提單者：@${issue.user.login}`,
              ``,
              `### 已整理內容`,
              `- 重現步驟：${steps}`,
              `- 實際結果：${actual}`,
              `- 預期結果：${expected}`,
              `- 相關元件/檔案：${files}`,
              `- 補充資訊：${extra}`,
              ``,
              `### 下一步`,
              `- 由維護者手動將 Issue 指派給 @copilot。`,
              `- 指派後會觸發修復工作流，並請 Copilot 進行修復、測試、開 PR。`,
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: comment,
            });
