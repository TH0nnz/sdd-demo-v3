name: Auto-Fix from Issue Comment

# ==============================================================================
# 手動重觸發工作流：在 Issue 留言輸入 /fix 可重新指派 Copilot 進行修復
# ==============================================================================
#
# 此 Workflow 在 Issue 中偵測到 /fix 指令時，將 Issue 指派給 GitHub Copilot
# 並發佈詳細的任務指示，請 Copilot 修復程式碼並產生 .autofix/ 報告。
#
# 【使用方式】
#   在任何 Issue 的留言中輸入：
#     /fix
#   或指定類別（可選）：
#     /fix ui
#     /fix flow
#     /fix logic
#     /fix add
#
# 【注意事項】
#   - 只有儲存庫擁有者（TH0nnz）的留言才會觸發此 Workflow。
#   - 確保在 Settings > Actions > General 已啟用：
#       ✓ Allow all actions and reusable workflows
#       ✓ Read and write permissions
#       ✓ Allow GitHub Actions to create and approve pull requests
#
# ==============================================================================

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

jobs:
  auto-fix:
    if: |
      github.event.issue.pull_request == null &&
      github.event.comment.user.login == 'TH0nnz' &&
      contains(github.event.comment.body, '/fix')
    runs-on: ubuntu-latest

    steps:
      - name: Extract context
        id: ctx
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          echo "issue_number=${ISSUE_NUMBER}" >> "$GITHUB_OUTPUT"

          # Detect optional category from the slash command, e.g. /fix ui
          CATEGORY=$(echo "$COMMENT_BODY" \
            | grep -Eo '/fix\s+(ui|flow|logic|add)' \
            | grep -Eo '(ui|flow|logic|add)' | head -1 || true)
          echo "category=${CATEGORY}" >> "$GITHUB_OUTPUT"

      - name: Assign to Copilot and post instructions
        uses: actions/github-script@v7
        env:
          CATEGORY: ${{ steps.ctx.outputs.category }}
          COMMENT_BODY: ${{ github.event.comment.body }}
        with:
          script: |
            const issueNumber = ${{ steps.ctx.outputs.issue_number }};
            const category    = process.env.CATEGORY ?? '';
            const categoryTag = category ? ` [${category}]` : '';
            const autofixFile = `.autofix/issue-${issueNumber}.md`;

            // Ensure Copilot is assigned (re-assign if needed to re-trigger).
            try {
              await github.rest.issues.addAssignees({
                owner:        context.repo.owner,
                repo:         context.repo.repo,
                issue_number: issueNumber,
                assignees:    ['copilot'],
              });
            } catch (e) {
              core.warning(`Could not assign Copilot: ${e.message}`);
            }

            // Post an instruction comment for the Copilot agent.
            const comment = [
              `@copilot 請根據此 Issue 的描述進行修復${categoryTag}。（由 /fix 指令重新觸發）`,
              ``,
              `## 任務要求`,
              `1. 根據 Issue 內容，找出相關程式碼並進行修正。`,
              `2. 完成修改後，在 \`${autofixFile}\` 建立一份 Markdown 報告，包含：`,
              `   - **問題描述**：重述此 Issue 要解決的問題`,
              `   - **修改檔案清單**：列出所有更動的檔案及更動摘要`,
              `   - **修復說明**：說明修復邏輯與思路`,
              `   - **測試步驟**：如何驗證修復成果`,
              `3. 將所有變更（程式碼修改 + \`${autofixFile}\`）放入同一個 commit，並開立 PR 供審核。`,
            ].join('\n');

            await github.rest.issues.createComment({
              owner:        context.repo.owner,
              repo:         context.repo.repo,
              issue_number: issueNumber,
              body:         comment,
            });
