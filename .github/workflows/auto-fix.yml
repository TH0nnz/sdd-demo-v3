name: Auto-Fix from Issue Comment

# ==============================================================================
# 自動修復工作流配置說明
# ==============================================================================
#
# 此 Workflow 用於自動建立修復分支和 PR，優先使用 PAT_TOKEN 進行認證。
#
# 【Token 優先級】
#   1. 優先使用：PAT_TOKEN（Personal Access Token）
#   2. 降級使用：GITHUB_TOKEN（GitHub Actions 預設 token）
#
# 【如何設定 PAT_TOKEN】
#   1. 前往儲存庫（Repository）頁面。
#   2. 點選右上角 Settings > Secrets and variables > Actions。
#   3. 點選「New repository secret」。
#   4. Name 欄輸入：PAT_TOKEN
#   5. Secret 欄貼上你的 Github Personal Access Token。
#      - 產生方式：https://github.com/settings/tokens/new
#      - 建議選「Fine-grained token」。
#      - 權限至少包含：
#           Repository permissions: Contents（Write）
#           Pull requests（Write）
#           Repository access: 只選本儲存庫即可
#   6. 儲存
#
# 【注意事項】
#   - 如果未設定 PAT_TOKEN，workflow 會自動降級使用 GitHub Actions 內建的 GITHUB_TOKEN。
#   - 確保在 Settings > Actions > General 已啟用：
#       ✓ Allow all actions and reusable workflows
#       ✓ Require approval for first-time contributors（可按需開關）
#       ✓ Read and write permissions
#       ✓ Allow GitHub Actions to create and approve pull requests
#   - PAT_TOKEN 必要權限：repo > contents:write, pull_requests:write
#
# ==============================================================================

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: read

jobs:
  auto-fix:
    if: |
      github.event.issue.pull_request == null &&
      github.event.comment.user.login == 'TH0nnz' &&
      contains(github.event.comment.body, '/fix')
    runs-on: ubuntu-latest

    steps:
      - name: Clean workspace
        run: |
          rm -rf .autofix/ || true
        shell: bash

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # 固定使用 github.token 確保 checkout 一定成功。
          # PAT_TOKEN 僅用於 push / PR 等需要額外權限的步驟。
          token: ${{ github.token }}


      - name: Extract context
        id: ctx
        # Pass only safe, non-expandable values via ${{ }} expressions.
        # issue.number is an integer produced by GitHub — safe to use directly.
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
          COMMENT_URL: ${{ github.event.comment.html_url }}
        run: |
          BRANCH_NAME="autofix/issue-${ISSUE_NUMBER}"
          echo "issue_number=${ISSUE_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "branch_name=${BRANCH_NAME}"   >> "$GITHUB_OUTPUT"
          echo "ISSUE_URL=${ISSUE_URL}"       >> "$GITHUB_ENV"
          echo "COMMENT_URL=${COMMENT_URL}"   >> "$GITHUB_ENV"

      - name: Create fix branch
        env:
          BRANCH_NAME: ${{ steps.ctx.outputs.branch_name }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH_NAME"

      - name: Write autofix context file
        # Untrusted string values (title, body, comment) are passed through env vars
        # and written via Python to avoid any shell-injection or heredoc-terminator risks.
        env:
          ISSUE_NUMBER: ${{ steps.ctx.outputs.issue_number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          mkdir -p .autofix
          python3 - <<'PYEOF'
          import os, pathlib, textwrap

          num     = os.environ["ISSUE_NUMBER"]
          title   = os.environ.get("ISSUE_TITLE",  "")
          body    = os.environ.get("ISSUE_BODY",   "")
          comment = os.environ.get("COMMENT_BODY", "")
          iurl    = os.environ.get("ISSUE_URL",    "")
          curl    = os.environ.get("COMMENT_URL",  "")

          content = textwrap.dedent(f"""\
          # Auto-Fix: Issue #{num}

          **Issue title:** {title}
          **Issue URL:** {iurl}

          ## Issue body

          {body}

          ## Triggering comment

          {comment}

          **Comment URL:** {curl}

          ---
          *This file was created automatically by the auto-fix workflow.
          Replace this file (or the relevant source files) with the actual fix.*
          """)

          pathlib.Path(f".autofix/issue-{num}.md").write_text(content, encoding="utf-8")
          PYEOF

      - name: Commit autofix context
        env:
          ISSUE_NUMBER: ${{ steps.ctx.outputs.issue_number }}
        run: |
          git add .autofix/
          git commit -m "autofix: scaffold fix for issue #${ISSUE_NUMBER}"

      - name: Push branch
        env:
          BRANCH_NAME: ${{ steps.ctx.outputs.branch_name }}
          # PAT_TOKEN 若有設定則用來覆寫 remote URL，否則沿用 checkout 注入的 github.token 憑證
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          if [ -n "$PAT_TOKEN" ]; then
            REPO_URL="https://x-access-token:${PAT_TOKEN}@github.com/${{ github.repository }}.git"
            git remote set-url origin "$REPO_URL"
          fi
          # 使用 --force 覆蓋遠端分支，避免 non-fast-forward 與 delete 權限問題
          git push --force origin "$BRANCH_NAME"

      - name: Create pull request
        # github-token 固定使用 github.token（永遠有效）。
        # 若有設定 PAT_TOKEN，script 內部會以 PAT 重新建立 Octokit 實例，
        # 以取得建立/更新 PR 的額外權限。
        uses: actions/github-script@v7
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
        with:
          github-token: ${{ github.token }}
          script: |
            // 若 PAT_TOKEN 有設定，以它重建 Octokit 避免 github.token 無 PR 寫入權限
            // 注意：github-script@v7 已內建 'octokit' 變數，需命名為 ghClient 避免衝突
            const pat = process.env.PAT_TOKEN;
            const ghClient = pat
              ? github.getOctokit(pat)
              : github;

            const issueNumber = ${{ steps.ctx.outputs.issue_number }};
            const branchName  = '${{ steps.ctx.outputs.branch_name }}';
            const issueTitle  = process.env.ISSUE_TITLE  ?? '';
            const issueUrl    = process.env.ISSUE_URL    ?? '';
            const commentBody = process.env.COMMENT_BODY ?? '';
            const commentUrl  = process.env.COMMENT_URL  ?? '';

            // Detect optional category token from the slash command, e.g. /fix ui
            // Supported categories: ui, flow, logic  — update the regex below to add more.
            const match    = commentBody.match(/\/fix\s+(ui|flow|logic)/i);
            const category = match ? ` [${match[1].toLowerCase()}]` : '';

            const prBody = [
              `Automated fix${category} proposed in response to issue #${issueNumber}.`,
              ``,
              `### Issue`,
              `**${issueTitle}**`,
              `${issueUrl}`,
              ``,
              `### Triggered by comment`,
              `> ${commentBody.split('\n').join('\n> ')}`,
              ``,
              `${commentUrl}`,
              ``,
              `---`,
              `*Review and update the scaffolded file in \`.autofix/\` (or the relevant source files) before merging.*`,
            ].join('\n');

            // 檢查是否已有相同 head 分支的 PR
            const { data: existingPRs } = await ghClient.rest.pulls.list({
              owner:  context.repo.owner,
              repo:   context.repo.repo,
              head:   `${context.repo.owner}:${branchName}`,
              state:  'open',
            });

            const prTitle = `autofix${category}: issue #${issueNumber} – ${issueTitle}`;

            if (existingPRs.length > 0) {
              // 更新現有 PR
              const existingPR = existingPRs[0];
              await ghClient.rest.pulls.update({
                owner:       context.repo.owner,
                repo:        context.repo.repo,
                pull_number: existingPR.number,
                title:       prTitle,
                body:        prBody,
              });
              core.info(`Updated existing PR #${existingPR.number}`);
            } else {
              // 建立新 PR
              await ghClient.rest.pulls.create({
                owner:  context.repo.owner,
                repo:   context.repo.repo,
                title:  prTitle,
                head:   branchName,
                base:   context.payload.repository.default_branch,
                body:   prBody,
              });
              core.info(`Created new PR for branch ${branchName}`);
            }
