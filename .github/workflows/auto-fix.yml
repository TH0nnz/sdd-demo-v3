name: Auto-Fix on Copilot Assigned

# ==============================================================================
# 手動啟動工作流：由維護者將 Issue 指派給 copilot 後啟動修復流程
# ==============================================================================
#
# 此 Workflow 會在 Issue 被指派給 copilot 時觸發，並透過 @copilot mention
# 發佈詳細的任務指示，請 Copilot 修復程式碼並產生 .autofix/ 報告。
#
# 【使用方式】
#   1) QA 建立 Issue
#   2) 維護者在 Issue 右側 Assignees 指派 copilot
#
# 【注意事項】
#   - 只有當 assignee 為 copilot 時才會觸發此 Workflow。
#   - 確保在 Settings > Actions > General 已啟用：
#       ✓ Allow all actions and reusable workflows
#       ✓ Read and write permissions
#       ✓ Allow GitHub Actions to create and approve pull requests
#
# ==============================================================================

on:
  issues:
    types: [assigned]

permissions:
  contents: write      # 允許推送程式碼
  pull-requests: write # 允許建立 PR
  issues: write        # 允許操作 issues

jobs:
  auto-fix:
    if: |
      github.event.issue.pull_request == null &&
      github.event.assignee.login == 'copilot'
    runs-on: ubuntu-latest

    steps:
      - name: Extract context
        id: ctx
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          echo "issue_number=${ISSUE_NUMBER}" >> "$GITHUB_OUTPUT"

          # Extract category from issue body section "類型"
          CATEGORY=$(echo "$ISSUE_BODY" \
            | awk '/^### 類型/{found=1; next} found && NF{print tolower($0); exit}' \
            | grep -Eo '(ui|flow|logic|add)' | head -1 || true)
          echo "category=${CATEGORY}" >> "$GITHUB_OUTPUT"

      - name: Notify Copilot and post instructions
        uses: actions/github-script@v7
        env:
          CATEGORY: ${{ steps.ctx.outputs.category }}
        with:
          script: |
            const issueNumber = ${{ steps.ctx.outputs.issue_number }};
            const category    = process.env.CATEGORY ?? '';
            const categoryTag = category ? ` [${category}]` : '';
            const autofixFile = `.autofix/issue-${issueNumber}.md`;

            // Note: Copilot assignment is handled via @copilot mention in the comment below.
            // GitHub's mention system will notify the Copilot agent automatically.
            core.info(`Workflow triggered for Issue #${issueNumber} with instructions for Copilot`);

            // Post an instruction comment for the Copilot agent.
            const baseBranch = context.payload.repository.default_branch || 'main';
            const comment = [
              `@copilot 請根據此 Issue 的描述進行修復${categoryTag}。（由 maintainer 指派觸發）`,
              ``,
              `> **目標分支**：請將 PR 開立至 \`${baseBranch}\` 分支。`,
              ``,
              `## 資訊檢查清單（請確保 Issue 內容已補充）`,
              ``,
              `在本人進行修復前，請確認 Issue 內容已包含以下資訊：`,
              ``,
              `- [ ] **類型**：UI / Flow / Logic / Add 其中之一`,
              `- [ ] **重現步驟**：清楚列出如何重現問題`,
              `- [ ] **實際結果**：描述目前觀察到的不正確行為`,
              `- [ ] **預期結果**：描述期望的正確行為`,
              `- [ ] **相關元件/檔案**（強烈建議）：指出出問題的檔案`,
              `- [ ] **補充資訊**（可選）：如有 Console log 或截圖，請附上`,
              ``,
              `若 Issue 內容不完整，請先在 Issue 補充資訊後再重新指派。`,
              ``,

              `## 任務要求`,
              `1. 根據 Issue 內容，找出相關程式碼並進行修正。`,
              `2. 完成修改後，在 \`${autofixFile}\` 建立一份 Markdown 報告，包含：`,
              `   - **問題描述**：重述此 Issue 要解決的問題`,
              `   - **修改檔案清單**：列出所有更動的檔案及更動摘要`,
              `   - **修復說明**：說明修復邏輯與思路`,
              `   - **測試步驟**：如何驗證修復成果`,
              `3. 將所有變更（程式碼修改 + \`${autofixFile}\`）放入同一個 commit，並開立 PR 供審核。`,
              ``,
              `## Commit 錯誤處理`,
              `如果在 commit 時遇到錯誤，請依照以下步驟排除：`,
              `- **Lint／格式錯誤**：執行對應的格式化指令（如 \`eslint --fix\`、\`prettier --write\`）修正後重新 commit。`,
              `- **測試失敗**：閱讀錯誤訊息，修正導致測試失敗的程式碼後重新 commit。`,
              `- **Merge conflict**：使用 \`git status\` 確認衝突檔案，手動解決衝突後執行 \`git add\` 再重新 commit。`,
              `- **Nothing to commit**：確認修改已正確儲存至磁碟，必要時重新套用變更。`,
              `- **其他錯誤**：閱讀完整錯誤訊息，依錯誤類型採取對應修正，排除後再重試 commit。`,
              ``,
              `每次排除錯誤後，請重新驗證所有變更並再次嘗試 commit，直到成功為止。`,
            ].join('\n');

            await github.rest.issues.createComment({
              owner:        context.repo.owner,
              repo:         context.repo.repo,
              issue_number: issueNumber,
              body:         comment,
            });
